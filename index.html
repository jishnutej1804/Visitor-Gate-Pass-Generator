<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Visitor Pass</title>

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Visitor Gate Pass</h1>

<div class="card">

<form id="visitorForm">

    <!-- FIX: IDs must match JS exactly -->
    <div class="input-group">
        <span>👤</span>
        <input type="text" id="name" placeholder="Name" required>
    </div>

    <div class="input-group">
        <span>📞</span>
        <input type="tel" id="phone" pattern="[0-9]{10}" placeholder="Phone" required>
    </div>

    <div class="input-group">
        <span>✉️</span>
        <input type="email" id="email" placeholder="Email" required>
    </div>

    <div class="input-group">
        <span>🎯</span>
        <input type="text" id="purpose" placeholder="Purpose" required>
    </div>

    <div class="input-group">
        <span>👨‍🏫</span>
        <input type="text" id="host" placeholder="Host" required>
    </div>

    <div class="input-group">
        <span>📅</span>
        <input type="datetime-local" id="datetime" required>
    </div>

    <button type="submit">Generate Pass</button>

</form>

</div>

<!-- SUCCESS -->
<div id="success" class="hidden success">✔ Pass Generated</div>

<!-- PASS -->
<div id="pass" class="pass hidden">
    <h2>Visitor Pass</h2>

    <div id="printArea"> <!-- FIX: print only this -->
        <p>ID: <span id="passId"></span></p>
        <p>Name: <span id="passName"></span></p>
        <p>Phone: <span id="passPhone"></span></p>
        <p>Purpose: <span id="passPurpose"></span></p>
        <p>Host: <span id="passHost"></span></p>
        <p>Date: <span id="passDate"></span></p>

        <div id="qrcode"></div>
    </div>

    <button onclick="printPass()">Print</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="script.js"></script>

</body>
</html>
